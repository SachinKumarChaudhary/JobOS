<section class="screen active" id="settings">
  <div class="screen-header">
    <div class="breadcrumb">Account / Settings</div>
    <div class="flex-row">
      <h2>Settings</h2>
      <span class="btn btn-sm btn-primary">Save Changes</span>
    </div>
  </div>
  <div class="screen-main">
    <div class="settings-layout">
      <div class="settings-tabs">
        <span class="settings-tab active">Account</span>
        <span class="settings-tab">Password</span>
        <span class="settings-tab">Notifications</span>
        <span class="settings-tab">Privacy</span>
        <span class="settings-tab">Appearance</span>
        <span class="settings-tab" style="color:var(--gray-600);font-weight:600">Danger Zone</span>
      </div>

      <div class="settings-content">
        <div class="card settings-card">
          <div class="card-title">Account Information</div>
          <div class="form-grid">
            <div class="input-group"><label>Full Name</label><input class="input" type="text" value="Sahil Kumar" readonly></div>
            <div class="input-group"><label>Email Address</label><input class="input" type="email" value="sahil@email.com" readonly></div>
            <div class="input-group"><label>Job Title</label><input class="input" type="text" value="Senior Frontend Engineer" readonly></div>
            <div class="input-group"><label>Location</label><input class="input" type="text" value="San Francisco, CA" readonly></div>
          </div>
          <div class="input-group" style="margin-top:12px"><label>Bio</label><div class="bio-box">Passionate frontend engineer with 5+ years of experience...</div></div>
        </div>

        <div class="card settings-card">
          <div class="card-title">Notification Preferences</div>
          <div class="pref-list">
            <label class="pref-item">
              <span class="pref-text">
                <span class="pref-title">Job Alerts</span>
                <span class="pref-meta">Receive updates when matching jobs are posted.</span>
              </span>
              <span class="toggle on"></span>
            </label>
            <label class="pref-item">
              <span class="pref-text">
                <span class="pref-title">Application Reminders</span>
                <span class="pref-meta">Get reminders to follow up on active applications.</span>
              </span>
              <span class="toggle on"></span>
            </label>
            <label class="pref-item">
              <span class="pref-text">
                <span class="pref-title">Weekly Summary</span>
                <span class="pref-meta">A compact overview of your weekly activity.</span>
              </span>
              <span class="toggle"></span>
            </label>
          </div>
        </div>

        <div class="card settings-card">
          <div class="card-title">Password</div>
          <div class="form-grid">
            <div class="input-group"><label>Current Password</label><input class="input" type="password" value="••••••••" readonly></div>
            <div class="input-group"><label>New Password</label><input class="input" type="password" value="••••••••" readonly></div>
            <div class="input-group"><label>Confirm Password</label><input class="input" type="password" value="••••••••" readonly></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
