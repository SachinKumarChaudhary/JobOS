<section class="screen active" id="register">
  <div class="auth-page">
    <div class="auth-card">
      <div class="auth-header">
        <div class="auth-logo">GA</div>
        <h2>Create an account</h2>
        <p>Start tracking your job applications today</p>
      </div>
      <div class="card" style="padding:20px">
        <div class="input-group" style="margin-bottom:12px"><label>Full Name</label><input class="input" type="text" placeholder="e.g. Sahil Kumar" readonly></div>
        <div class="input-group" style="margin-bottom:12px"><label>Email</label><input class="input" type="email" placeholder="you@email.com" readonly></div>
        <div class="input-group" style="margin-bottom:12px"><label>Password</label><input class="input" type="password" placeholder="Min. 8 characters" readonly></div>
        <div class="input-group" style="margin-bottom:16px"><label>Confirm Password</label><input class="input" type="password" placeholder="Re-enter password" readonly></div>
        <span class="btn btn-primary" style="width:100%;margin-bottom:12px">Create Account</span>
        <div class="auth-link">Already have an account? <a href="#login">Sign in</a></div>
      </div>
    </div>
  </div>
</section>
