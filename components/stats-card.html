<div class="card">
  <div style="display:flex;align-items:center;gap:6px;margin-bottom:8px">
    <div style="width:16px;height:16px;background:var(--gray-200);border-radius:4px;flex-shrink:0"></div>
    <span style="font-size:11px;color:var(--gray-400)">{label}</span>
  </div>
  <div style="font-size:22px;font-weight:700;color:var(--gray-900)">{value}</div>
  <div style="font-size:10px;color:var(--gray-400);margin-top:2px">{change}</div>
</div>
