<div class="notif-item {unread}">
  <div class="dot {dotClass}"></div>
  <div style="flex:1;min-width:0">
    <div style="font-size:12px;font-weight:600;color:var(--gray-900)">{title}</div>
    <div style="font-size:10px;color:var(--gray-400);margin-top:2px">{message}</div>
    <div style="font-size:10px;color:var(--gray-300);margin-top:6px">{time}</div>
  </div>
  <div style="font-size:10px;color:var(--gray-400);font-weight:600;flex-shrink:0">Dismiss</div>
</div>
